<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Colorful low-poly hummingbird with enhanced colors -->
  
  <!-- Background glow effect -->
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#10B981;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#10B981;stop-opacity:0" />
    </radialGradient>
  </defs>
  
  <circle cx="200" cy="220" r="120" fill="url(#glow)" />
  
  <!-- Body (low-poly geometric style with vibrant colors) -->
  <g id="body">
    <!-- Main body - vibrant emerald green -->
    <polygon points="200,180 220,200 220,240 200,260 180,240 180,200" fill="#10B981" />
    <polygon points="220,200 240,210 240,230 220,240" fill="#059669" />
    <polygon points="180,200 160,210 160,230 180,240" fill="#34D399" />
    
    <!-- Chest - bright golden accent -->
    <polygon points="200,220 215,230 200,245 185,230" fill="#F59E0B" />
    <polygon points="200,225 210,232 200,240 190,232" fill="#FBBF24" />
    
    <!-- Head with iridescent effect -->
    <polygon points="200,160 220,170 220,190 200,180 180,190 180,170" fill="#10B981" />
    <polygon points="200,165 215,172 215,185 200,180" fill="#34D399" />
    <polygon points="200,165 185,172 185,185 200,180" fill="#059669" />
    
    <!-- Eyes -->
    <circle cx="190" cy="175" r="4" fill="#1F2937" />
    <circle cx="210" cy="175" r="4" fill="#1F2937" />
    <circle cx="191" cy="174" r="1.5" fill="#FFFFFF" />
    <circle cx="211" cy="174" r="1.5" fill="#FFFFFF" />
    
    <!-- Beak - long and pointed with gradient -->
    <polygon points="200,160 206,135 200,142 194,135" fill="#DC2626" />
    <polygon points="200,142 206,135 203,138" fill="#EF4444" />
    <polygon points="200,142 194,135 197,138" fill="#B91C1C" />
    
    <!-- Tail feathers - vibrant blue gradient -->
    <polygon points="200,260 215,295 205,288" fill="#3B82F6" />
    <polygon points="200,260 185,295 195,288" fill="#2563EB" />
    <polygon points="200,260 208,300 200,293" fill="#1D4ED8" />
    <polygon points="200,260 192,300 200,293" fill="#1E40AF" />
    
    <!-- Tail accent - pink/purple -->
    <polygon points="205,288 208,300 200,295" fill="#EC4899" opacity="0.7" />
    <polygon points="195,288 192,300 200,295" fill="#A855F7" opacity="0.7" />
  </g>
  
  <!-- Left Wing (animated with colorful segments) -->
  <g id="leftWing" transform-origin="180 200">
    <!-- Outer wing segment - bright green -->
    <polygon points="180,200 140,180 120,190 100,200 120,210 140,215 160,210" fill="#10B981" opacity="0.95">
      <animateTransform
        attributeName="transform"
        attributeType="XML"
        type="rotate"
        values="0 180 200; -50 180 200; 0 180 200"
        dur="0.3s"
        repeatCount="indefinite"
      />
    </polygon>
    <!-- Middle wing segment - teal -->
    <polygon points="140,180 120,170 100,180 100,200 120,190" fill="#14B8A6" opacity="0.9">
      <animateTransform
        attributeName="transform"
        attributeType="XML"
        type="rotate"
        values="0 180 200; -50 180 200; 0 180 200"
        dur="0.3s"
        repeatCount="indefinite"
      />
    </polygon>
    <!-- Inner wing segment - cyan accent -->
    <polygon points="160,210 140,215 130,220 140,225 160,220" fill="#06B6D4" opacity="0.8">
      <animateTransform
        attributeName="transform"
        attributeType="XML"
        type="rotate"
        values="0 180 200; -50 180 200; 0 180 200"
        dur="0.3s"
        repeatCount="indefinite"
      />
    </polygon>
  </g>
  
  <!-- Right Wing (animated with colorful segments) -->
  <g id="rightWing" transform-origin="220 200">
    <!-- Outer wing segment - bright green -->
    <polygon points="220,200 260,180 280,190 300,200 280,210 260,215 240,210" fill="#10B981" opacity="0.95">
      <animateTransform
        attributeName="transform"
        attributeType="XML"
        type="rotate"
        values="0 220 200; 50 220 200; 0 220 200"
        dur="0.3s"
        repeatCount="indefinite"
      />
    </polygon>
    <!-- Middle wing segment - teal -->
    <polygon points="260,180 280,170 300,180 300,200 280,190" fill="#14B8A6" opacity="0.9">
      <animateTransform
        attributeName="transform"
        attributeType="XML"
        type="rotate"
        values="0 220 200; 50 220 200; 0 220 200"
        dur="0.3s"
        repeatCount="indefinite"
      />
    </polygon>
    <!-- Inner wing segment - cyan accent -->
    <polygon points="240,210 260,215 270,220 260,225 240,220" fill="#06B6D4" opacity="0.8">
      <animateTransform
        attributeName="transform"
        attributeType="XML"
        type="rotate"
        values="0 220 200; 50 220 200; 0 220 200"
        dur="0.3s"
        repeatCount="indefinite"
      />
    </polygon>
  </g>
  
  <!-- Subtle hover animation for entire bird -->
  <animateTransform
    attributeName="transform"
    attributeType="XML"
    type="translate"
    values="0,0; 0,-8; 0,0"
    dur="2.5s"
    repeatCount="indefinite"
  />
</svg>
