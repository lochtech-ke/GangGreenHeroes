<?xml version="1.0" encoding="UTF-8"?>
<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  
    <defs>
      <pattern id="bgPattern" x="0" y="0" width="80" height="80" patternUnits="userSpaceOnUse">
        <polygon points="0,0 40,20 0,40" fill="#E8E8E8" opacity="0.1"/>
        <polygon points="40,20 80,0 80,40" fill="#F0F0F0" opacity="0.1"/>
        <polygon points="0,40 40,60 0,80" fill="#FFFFFF" opacity="0.1"/>
        <polygon points="40,60 80,40 80,80" fill="#E8E8E8" opacity="0.1"/>
      </pattern>
    </defs>
    <rect width="400" height="400" fill="#F8F8FF"/>
    <rect width="400" height="400" fill="url(#bgPattern)"/>
  
  
    <rect x="10" y="10" width="380" height="380" 
          fill="none" stroke="#D3D3D3" stroke-width="3" opacity="0.6"/>
    <rect x="15" y="15" width="370" height="370" 
          fill="none" stroke="#B8B8B8" stroke-width="2" opacity="0.4"/>
  
  
    <!-- Tree Crown - Geometric Triangles -->
    <polygon points="200,80 160,140 240,140" fill="#C0C0C0" opacity="0.9"/>
    <polygon points="200,100 150,160 250,160" fill="#A8A8A8" opacity="0.85"/>
    <polygon points="200,120 140,180 260,180" fill="#909090" opacity="0.8"/>
    <polygon points="160,140 180,160 200,140" fill="#C0C0C0" opacity="0.95"/>
    <polygon points="200,140 220,160 240,140" fill="#A8A8A8" opacity="0.95"/>
    
    <!-- Tree Trunk - Geometric Rectangles -->
    <polygon points="190,180 210,180 215,260 185,260" fill="#8B4513" opacity="0.9"/>
    <polygon points="195,200 205,200 208,240 192,240" fill="#A0522D" opacity="0.85"/>
  
  
    <!-- Tier Badge -->
    <rect x="150" y="330" width="100" height="30" rx="15" 
          fill="#C0C0C0" opacity="0.9"/>
    <text x="200" y="350" font-family="Arial, sans-serif" font-size="14" 
          font-weight="bold" fill="#FFFFFF" text-anchor="middle">
      SILVER
    </text>
    
    <!-- Badge Name -->
    <text x="200" y="375" font-family="Arial, sans-serif" font-size="12" 
          fill="#A8A8A8" text-anchor="middle" opacity="0.8">
      Tree Planter
    </text>
    
    
    <!-- Value Display -->
    <text x="200" y="390" font-family="Arial, sans-serif" font-size="16" 
          font-weight="bold" fill="#C0C0C0" text-anchor="middle">
      50
    </text>
    
  
</svg>