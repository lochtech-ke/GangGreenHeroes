<?xml version="1.0" encoding="UTF-8"?>
<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  
    <defs>
      <pattern id="bgPattern" x="0" y="0" width="80" height="80" patternUnits="userSpaceOnUse">
        <polygon points="0,0 40,20 0,40" fill="#FFD700" opacity="0.1"/>
        <polygon points="40,20 80,0 80,40" fill="#FFA500" opacity="0.1"/>
        <polygon points="0,40 40,60 0,80" fill="#FF8C00" opacity="0.1"/>
        <polygon points="40,60 80,40 80,80" fill="#FFD700" opacity="0.1"/>
      </pattern>
    </defs>
    <rect width="400" height="400" fill="#F5F5DC"/>
    <rect width="400" height="400" fill="url(#bgPattern)"/>
  
  
    <rect x="10" y="10" width="380" height="380" 
          fill="none" stroke="#8B4513" stroke-width="3" opacity="0.6"/>
    <rect x="15" y="15" width="370" height="370" 
          fill="none" stroke="#D2691E" stroke-width="2" opacity="0.4"/>
  
  
    <!-- Leaf Body - Geometric Facets -->
    <path d="M 200,80 Q 260,120 280,200 Q 260,260 200,280 Q 180,260 180,200 Q 180,120 200,80 Z" 
          fill="#CD7F32" opacity="0.9"/>
    
    <!-- Leaf Veins and Facets -->
    <polygon points="200,80 220,120 200,160 180,120" fill="#B87333" opacity="0.95"/>
    <polygon points="200,160 230,180 240,220 200,240" fill="#A0522D" opacity="0.85"/>
    <polygon points="200,160 170,180 160,220 200,240" fill="#B87333" opacity="0.85"/>
    <polygon points="200,240 220,260 200,280 180,260" fill="#CD7F32" opacity="0.8"/>
    
    <!-- Stem -->
    <line x1="200" y1="280" x2="200" y2="320" stroke="#A0522D" stroke-width="4" opacity="0.9"/>
  
  
    <!-- Tier Badge -->
    <rect x="150" y="330" width="100" height="30" rx="15" 
          fill="#CD7F32" opacity="0.9"/>
    <text x="200" y="350" font-family="Arial, sans-serif" font-size="14" 
          font-weight="bold" fill="#FFFFFF" text-anchor="middle">
      BRONZE
    </text>
    
    <!-- Badge Name -->
    <text x="200" y="375" font-family="Arial, sans-serif" font-size="12" 
          fill="#B87333" text-anchor="middle" opacity="0.8">
      Carbon Champion
    </text>
    
    
    <!-- Value Display -->
    <text x="200" y="390" font-family="Arial, sans-serif" font-size="16" 
          font-weight="bold" fill="#CD7F32" text-anchor="middle">
      100
    </text>
    
  
</svg>