<?xml version="1.0" encoding="UTF-8"?>
<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  
    <defs>
      <pattern id="bgPattern" x="0" y="0" width="80" height="80" patternUnits="userSpaceOnUse">
        <polygon points="0,0 40,20 0,40" fill="#FF1493" opacity="0.1"/>
        <polygon points="40,20 80,0 80,40" fill="#FF69B4" opacity="0.1"/>
        <polygon points="0,40 40,60 0,80" fill="#FFB6C1" opacity="0.1"/>
        <polygon points="40,60 80,40 80,80" fill="#FF1493" opacity="0.1"/>
      </pattern>
    </defs>
    <rect width="400" height="400" fill="#E0FFFF"/>
    <rect width="400" height="400" fill="url(#bgPattern)"/>
  
  
    <rect x="10" y="10" width="380" height="380" 
          fill="none" stroke="#1E90FF" stroke-width="3" opacity="0.6"/>
    <rect x="15" y="15" width="370" height="370" 
          fill="none" stroke="#4682B4" stroke-width="2" opacity="0.4"/>
  
  
    <!-- Shield Outline -->
    <path d="M 200,60 L 280,100 L 280,200 Q 280,260 200,300 Q 120,260 120,200 L 120,100 Z" 
          fill="#B9F2FF" opacity="0.9"/>
    
    <!-- Shield Facets -->
    <polygon points="200,60 240,80 200,120 160,80" fill="#00CED1" opacity="0.95"/>
    <polygon points="160,80 200,120 200,180 140,140" fill="#4169E1" opacity="0.85"/>
    <polygon points="240,80 260,140 200,180 200,120" fill="#00CED1" opacity="0.85"/>
    <polygon points="140,140 200,180 200,240 130,200" fill="#B9F2FF" opacity="0.8"/>
    <polygon points="260,140 270,200 200,240 200,180" fill="#4169E1" opacity="0.8"/>
    <polygon points="200,180 200,240 160,270 140,220" fill="#00CED1" opacity="0.75"/>
    <polygon points="200,180 240,220 240,270 200,240" fill="#B9F2FF" opacity="0.75"/>
  
  
    <!-- Tier Badge -->
    <rect x="150" y="330" width="100" height="30" rx="15" 
          fill="#B9F2FF" opacity="0.9"/>
    <text x="200" y="350" font-family="Arial, sans-serif" font-size="14" 
          font-weight="bold" fill="#FFFFFF" text-anchor="middle">
      DIAMOND
    </text>
    
    <!-- Badge Name -->
    <text x="200" y="375" font-family="Arial, sans-serif" font-size="12" 
          fill="#00CED1" text-anchor="middle" opacity="0.8">
      Forest Guardian
    </text>
    
    
    <!-- Value Display -->
    <text x="200" y="390" font-family="Arial, sans-serif" font-size="16" 
          font-weight="bold" fill="#B9F2FF" text-anchor="middle">
      20
    </text>
    
  
</svg>