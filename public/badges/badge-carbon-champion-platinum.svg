<?xml version="1.0" encoding="UTF-8"?>
<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  
    <defs>
      <pattern id="bgPattern" x="0" y="0" width="80" height="80" patternUnits="userSpaceOnUse">
        <polygon points="0,0 40,20 0,40" fill="#00CED1" opacity="0.1"/>
        <polygon points="40,20 80,0 80,40" fill="#20B2AA" opacity="0.1"/>
        <polygon points="0,40 40,60 0,80" fill="#48D1CC" opacity="0.1"/>
        <polygon points="40,60 80,40 80,80" fill="#00CED1" opacity="0.1"/>
      </pattern>
    </defs>
    <rect width="400" height="400" fill="#F0F8FF"/>
    <rect width="400" height="400" fill="url(#bgPattern)"/>
  
  
    <rect x="10" y="10" width="380" height="380" 
          fill="none" stroke="#C9C0BB" stroke-width="3" opacity="0.6"/>
    <rect x="15" y="15" width="370" height="370" 
          fill="none" stroke="#B4B4B4" stroke-width="2" opacity="0.4"/>
  
  
    <!-- Leaf Body - Geometric Facets -->
    <path d="M 200,80 Q 260,120 280,200 Q 260,260 200,280 Q 180,260 180,200 Q 180,120 200,80 Z" 
          fill="#E5E4E2" opacity="0.9"/>
    
    <!-- Leaf Veins and Facets -->
    <polygon points="200,80 220,120 200,160 180,120" fill="#D1D0CE" opacity="0.95"/>
    <polygon points="200,160 230,180 240,220 200,240" fill="#BCC6CC" opacity="0.85"/>
    <polygon points="200,160 170,180 160,220 200,240" fill="#D1D0CE" opacity="0.85"/>
    <polygon points="200,240 220,260 200,280 180,260" fill="#E5E4E2" opacity="0.8"/>
    
    <!-- Stem -->
    <line x1="200" y1="280" x2="200" y2="320" stroke="#BCC6CC" stroke-width="4" opacity="0.9"/>
  
  
    <!-- Tier Badge -->
    <rect x="150" y="330" width="100" height="30" rx="15" 
          fill="#E5E4E2" opacity="0.9"/>
    <text x="200" y="350" font-family="Arial, sans-serif" font-size="14" 
          font-weight="bold" fill="#FFFFFF" text-anchor="middle">
      PLATINUM
    </text>
    
    <!-- Badge Name -->
    <text x="200" y="375" font-family="Arial, sans-serif" font-size="12" 
          fill="#D1D0CE" text-anchor="middle" opacity="0.8">
      Carbon Champion
    </text>
    
    
    <!-- Value Display -->
    <text x="200" y="390" font-family="Arial, sans-serif" font-size="16" 
          font-weight="bold" fill="#E5E4E2" text-anchor="middle">
      5,000
    </text>
    
  
</svg>