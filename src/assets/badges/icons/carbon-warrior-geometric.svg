<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <title>Geometric Shield</title>
  
  <!-- Shield outline -->
  <polygon points="60,20 85,30 85,70 60,95" fill="#4169E1"/>
  <polygon points="60,20 35,30 35,70 60,95" fill="#1E90FF"/>
  
  <!-- Inner sections -->
  <polygon points="60,30 75,38 75,65 60,85" fill="#87CEEB"/>
  <polygon points="60,30 45,38 45,65 60,85" fill="#00BFFF"/>
  
  <!-- Center emblem - CO2 symbol -->
  <polygon points="55,50 60,45 65,50" fill="#191970"/>
  <polygon points="55,50 60,55 65,50" fill="#000080"/>
  <polygon points="60,55 55,60 65,60" fill="#4682B4"/>
  
  <!-- Border highlights -->
  <polygon points="60,20 85,30 82,32 60,24" fill="#FFFFFF" opacity="0.3"/>
  <polygon points="60,20 35,30 38,32 60,24" fill="#FFFFFF" opacity="0.3"/>
</svg>
