<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <title>Geometric Hummingbird</title>
  
  <!-- Body (center) -->
  <polygon points="60,50 70,60 70,80 60,90 50,80 50,60" fill="#20B2AA"/>
  <polygon points="60,50 70,60 65,55" fill="#48D1CC"/>
  <polygon points="50,60 60,50 55,55" fill="#40E0D0"/>
  
  <!-- Head -->
  <polygon points="55,40 65,40 70,50 60,50 50,50" fill="#2E8B57"/>
  <polygon points="60,40 65,40 65,45" fill="#3CB371"/>
  
  <!-- Beak -->
  <polygon points="65,45 95,35 65,50" fill="#4169E1"/>
  <polygon points="65,45 95,35 80,40" fill="#5F9EA0"/>
  
  <!-- Eye -->
  <polygon points="62,43 64,43 63,45" fill="#FFFFFF"/>
  <circle cx="63" cy="44" r="1" fill="#000000"/>
  
  <!-- Upper wing (right) -->
  <polygon points="70,60 90,40 95,50" fill="#2E8B57"/>
  <polygon points="70,60 95,50 90,60" fill="#3CB371"/>
  <polygon points="70,60 90,60 85,70" fill="#90EE90"/>
  <polygon points="70,60 85,70 75,75" fill="#228B22"/>
  
  <!-- Upper wing (left) -->
  <polygon points="50,60 30,40 25,50" fill="#FF6347"/>
  <polygon points="50,60 25,50 30,60" fill="#FF7F50"/>
  <polygon points="50,60 30,60 35,70" fill="#FFA07A"/>
  <polygon points="50,60 35,70 45,75" fill="#CD5C5C"/>
  
  <!-- Lower wing (right) -->
  <polygon points="70,80 85,75 90,85" fill="#9370DB"/>
  <polygon points="70,80 90,85 85,95" fill="#8A2BE2"/>
  <polygon points="70,80 85,95 75,100" fill="#9932CC"/>
  
  <!-- Lower wing (left) -->
  <polygon points="50,80 35,75 30,85" fill="#FFD700"/>
  <polygon points="50,80 30,85 35,95" fill="#FFA500"/>
  <polygon points="50,80 35,95 45,100" fill="#FF8C00"/>
  
  <!-- Tail -->
  <polygon points="60,90 65,105 60,110" fill="#4169E1"/>
  <polygon points="60,90 60,110 55,105" fill="#1E90FF"/>
  <polygon points="55,105 60,110 50,115" fill="#87CEEB"/>
  <polygon points="65,105 60,110 70,115" fill="#00BFFF"/>
</svg>
