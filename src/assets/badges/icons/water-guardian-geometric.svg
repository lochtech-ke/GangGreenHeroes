<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <title>Geometric Water Drop</title>
  
  <!-- Main drop shape -->
  <polygon points="60,20 75,40 80,60" fill="#00CED1"/>
  <polygon points="60,20 45,40 40,60" fill="#48D1CC"/>
  <polygon points="40,60 60,90 80,60" fill="#40E0D0"/>
  <polygon points="40,60 50,75 60,90" fill="#7FFFD4"/>
  <polygon points="80,60 70,75 60,90" fill="#00CED1"/>
  
  <!-- Inner facets -->
  <polygon points="50,45 60,40 55,50" fill="#008B8B"/>
  <polygon points="60,40 70,45 65,50" fill="#20B2AA"/>
  <polygon points="55,50 65,50 60,60" fill="#5F9EA0"/>
  
  <!-- Highlight -->
  <polygon points="55,30 60,25 58,35" fill="#FFFFFF" opacity="0.6"/>
  <polygon points="50,40 55,35 52,45" fill="#FFFFFF" opacity="0.4"/>
  <polygon points="48,50 52,48 50,55" fill="#FFFFFF" opacity="0.3"/>
</svg>
