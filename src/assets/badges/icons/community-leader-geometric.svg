<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <title>Geometric People</title>
  
  <!-- Center person (larger) -->
  <polygon points="55,45 65,45 65,55 55,55" fill="#FF8C00"/>
  <polygon points="50,60 70,60 75,85 45,85" fill="#FFA500"/>
  <polygon points="50,60 55,55 65,55 70,60" fill="#FFB347"/>
  
  <!-- Left person -->
  <polygon points="30,50 38,50 38,58 30,58" fill="#CD5C5C"/>
  <polygon points="26,62 42,62 45,82 23,82" fill="#DC143C"/>
  <polygon points="26,62 30,58 38,58 42,62" fill="#B22222"/>
  
  <!-- Right person -->
  <polygon points="82,50 90,50 90,58 82,58" fill="#CD5C5C"/>
  <polygon points="78,62 94,62 97,82 75,82" fill="#DC143C"/>
  <polygon points="78,62 82,58 90,58 94,62" fill="#B22222"/>
  
  <!-- Connection lines (community) -->
  <polygon points="42,70 50,70 48,72 44,72" fill="#FFDAB9" opacity="0.6"/>
  <polygon points="70,70 78,70 76,72 72,72" fill="#FFDAB9" opacity="0.6"/>
</svg>
