<!-- Aya - "Fern" - Symbol of endurance and resourcefulness -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <pattern id="aya-pattern" x="0" y="0" width="100" height="100" patternUnits="userSpaceOnUse">
      <g opacity="0.15" fill="currentColor">
        <!-- Central stem -->
        <rect x="48" y="20" width="4" height="60" rx="2"/>
        <!-- Fern fronds - left side -->
        <ellipse cx="35" cy="30" rx="10" ry="4" transform="rotate(-30 35 30)"/>
        <ellipse cx="32" cy="40" rx="12" ry="4" transform="rotate(-35 32 40)"/>
        <ellipse cx="30" cy="50" rx="14" ry="4" transform="rotate(-40 30 50)"/>
        <ellipse cx="32" cy="60" rx="12" ry="4" transform="rotate(-45 32 60)"/>
        <ellipse cx="35" cy="70" rx="10" ry="4" transform="rotate(-50 35 70)"/>
        <!-- Fern fronds - right side -->
        <ellipse cx="65" cy="30" rx="10" ry="4" transform="rotate(30 65 30)"/>
        <ellipse cx="68" cy="40" rx="12" ry="4" transform="rotate(35 68 40)"/>
        <ellipse cx="70" cy="50" rx="14" ry="4" transform="rotate(40 70 50)"/>
        <ellipse cx="68" cy="60" rx="12" ry="4" transform="rotate(45 68 60)"/>
        <ellipse cx="65" cy="70" rx="10" ry="4" transform="rotate(50 65 70)"/>
      </g>
    </pattern>
  </defs>
  <rect width="100" height="100" fill="url(#aya-pattern)"/>
</svg>
