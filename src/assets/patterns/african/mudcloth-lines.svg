<!-- Mudcloth Lines - Traditional Malian mudcloth pattern -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <pattern id="mudcloth-lines-pattern" x="0" y="0" width="100" height="100" patternUnits="userSpaceOnUse">
      <g opacity="0.1" stroke="currentColor" fill="none">
        <!-- Horizontal lines with varying thickness -->
        <line x1="0" y1="10" x2="100" y2="10" stroke-width="3"/>
        <line x1="0" y1="15" x2="100" y2="15" stroke-width="1"/>
        <line x1="0" y1="20" x2="100" y2="20" stroke-width="2"/>
        
        <line x1="0" y1="35" x2="100" y2="35" stroke-width="2"/>
        <line x1="0" y1="40" x2="100" y2="40" stroke-width="3"/>
        <line x1="0" y1="45" x2="100" y2="45" stroke-width="1"/>
        
        <line x1="0" y1="60" x2="100" y2="60" stroke-width="1"/>
        <line x1="0" y1="65" x2="100" y2="65" stroke-width="2"/>
        <line x1="0" y1="70" x2="100" y2="70" stroke-width="3"/>
        
        <line x1="0" y1="85" x2="100" y2="85" stroke-width="2"/>
        <line x1="0" y1="90" x2="100" y2="90" stroke-width="1"/>
        <line x1="0" y1="95" x2="100" y2="95" stroke-width="2"/>
        
        <!-- Vertical accent marks -->
        <line x1="20" y1="8" x2="20" y2="22" stroke-width="1.5"/>
        <line x1="50" y1="33" x2="50" y2="47" stroke-width="1.5"/>
        <line x1="80" y1="58" x2="80" y2="72" stroke-width="1.5"/>
        <line x1="35" y1="83" x2="35" y2="97" stroke-width="1.5"/>
      </g>
    </pattern>
  </defs>
  <rect width="100" height="100" fill="url(#mudcloth-lines-pattern)"/>
</svg>
