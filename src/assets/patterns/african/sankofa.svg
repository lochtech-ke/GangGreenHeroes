<!-- Sankofa - "Go back and get it" - Symbol of learning from the past -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <pattern id="sankofa-pattern" x="0" y="0" width="100" height="100" patternUnits="userSpaceOnUse">
      <!-- Stylized bird looking backward -->
      <g opacity="0.15" fill="currentColor">
        <!-- Body -->
        <ellipse cx="50" cy="55" rx="15" ry="20"/>
        <!-- Head looking back -->
        <circle cx="45" cy="40" r="8"/>
        <!-- Beak -->
        <path d="M 38 38 L 35 36 L 38 34" stroke="currentColor" fill="none" stroke-width="2"/>
        <!-- Tail feathers -->
        <path d="M 50 70 Q 55 80 50 85 Q 45 80 50 70" fill="currentColor"/>
        <!-- Wing -->
        <path d="M 55 50 Q 65 55 60 65" stroke="currentColor" fill="none" stroke-width="2"/>
        <!-- Legs -->
        <line x1="45" y1="70" x2="42" y2="78" stroke="currentColor" stroke-width="2"/>
        <line x1="55" y1="70" x2="58" y2="78" stroke="currentColor" stroke-width="2"/>
        <!-- Egg (symbol of future) -->
        <ellipse cx="65" cy="45" rx="5" ry="7" fill="none" stroke="currentColor" stroke-width="1.5"/>
      </g>
    </pattern>
  </defs>
  <rect width="100" height="100" fill="url(#sankofa-pattern)"/>
</svg>
