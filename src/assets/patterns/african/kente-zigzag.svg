<!-- Kente Zigzag - Zigzag pattern from Kente weaving -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <pattern id="kente-zigzag-pattern" x="0" y="0" width="100" height="100" patternUnits="userSpaceOnUse">
      <g opacity="0.12" fill="none" stroke="currentColor" stroke-width="2.5">
        <!-- Zigzag lines -->
        <path d="M 0 20 L 10 10 L 20 20 L 30 10 L 40 20 L 50 10 L 60 20 L 70 10 L 80 20 L 90 10 L 100 20"/>
        <path d="M 0 40 L 10 30 L 20 40 L 30 30 L 40 40 L 50 30 L 60 40 L 70 30 L 80 40 L 90 30 L 100 40"/>
        <path d="M 0 60 L 10 50 L 20 60 L 30 50 L 40 60 L 50 50 L 60 60 L 70 50 L 80 60 L 90 50 L 100 60"/>
        <path d="M 0 80 L 10 70 L 20 80 L 30 70 L 40 80 L 50 70 L 60 80 L 70 70 L 80 80 L 90 70 L 100 80"/>
        <path d="M 0 100 L 10 90 L 20 100 L 30 90 L 40 100 L 50 90 L 60 100 L 70 90 L 80 100 L 90 90 L 100 100"/>
      </g>
    </pattern>
  </defs>
  <rect width="100" height="100" fill="url(#kente-zigzag-pattern)"/>
</svg>
