<!-- Mudcloth Crosshatch - Crosshatch pattern from mudcloth -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <pattern id="mudcloth-crosshatch-pattern" x="0" y="0" width="100" height="100" patternUnits="userSpaceOnUse">
      <g opacity="0.1" stroke="currentColor" fill="none" stroke-width="1.5">
        <!-- Diagonal lines going down-right -->
        <line x1="0" y1="0" x2="25" y2="25"/>
        <line x1="0" y1="25" x2="50" y2="75"/>
        <line x1="0" y1="50" x2="50" y2="100"/>
        <line x1="25" y1="0" x2="100" y2="75"/>
        <line x1="50" y1="0" x2="100" y2="50"/>
        <line x1="75" y1="0" x2="100" y2="25"/>
        <line x1="50" y1="25" x2="100" y2="75"/>
        <line x1="25" y1="50" x2="75" y2="100"/>
        <line x1="50" y1="75" x2="100" y2="100"/>
        
        <!-- Diagonal lines going down-left -->
        <line x1="100" y1="0" x2="75" y2="25"/>
        <line x1="100" y1="25" x2="50" y2="75"/>
        <line x1="100" y1="50" x2="50" y2="100"/>
        <line x1="75" y1="0" x2="0" y2="75"/>
        <line x1="50" y1="0" x2="0" y2="50"/>
        <line x1="25" y1="0" x2="0" y2="25"/>
        <line x1="50" y1="25" x2="0" y2="75"/>
        <line x1="75" y1="50" x2="25" y2="100"/>
        <line x1="50" y1="75" x2="0" y2="100"/>
      </g>
    </pattern>
  </defs>
  <rect width="100" height="100" fill="url(#mudcloth-crosshatch-pattern)"/>
</svg>
