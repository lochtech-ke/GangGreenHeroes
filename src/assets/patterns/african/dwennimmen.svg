<!-- Dwennimmen - "Ram's horns" - Symbol of strength and humility -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <pattern id="dwennimmen-pattern" x="0" y="0" width="100" height="100" patternUnits="userSpaceOnUse">
      <g opacity="0.15" fill="none" stroke="currentColor" stroke-width="2.5">
        <!-- Left horn spiral -->
        <path d="M 35 50 Q 30 45 30 40 Q 30 35 32 32 Q 35 28 40 28 Q 43 28 45 30"/>
        <path d="M 35 50 Q 32 52 30 55 Q 28 58 28 62 Q 28 65 30 67"/>
        <!-- Right horn spiral -->
        <path d="M 65 50 Q 70 45 70 40 Q 70 35 68 32 Q 65 28 60 28 Q 57 28 55 30"/>
        <path d="M 65 50 Q 68 52 70 55 Q 72 58 72 62 Q 72 65 70 67"/>
        <!-- Center connecting element -->
        <circle cx="50" cy="50" r="8" stroke-width="2"/>
        <circle cx="50" cy="50" r="3" fill="currentColor"/>
      </g>
    </pattern>
  </defs>
  <rect width="100" height="100" fill="url(#dwennimmen-pattern)"/>
</svg>
