<!-- Gye Nyame - "Except God" - Symbol of God's supremacy and omnipotence -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <pattern id="gye-nyame-pattern" x="0" y="0" width="100" height="100" patternUnits="userSpaceOnUse">
      <g opacity="0.12" fill="currentColor">
        <!-- Central circle -->
        <circle cx="50" cy="50" r="12" fill="none" stroke="currentColor" stroke-width="2"/>
        <!-- Four curved arms extending from center -->
        <path d="M 50 38 Q 50 30 45 25 Q 40 20 35 22" stroke="currentColor" fill="none" stroke-width="2.5"/>
        <path d="M 62 50 Q 70 50 75 45 Q 80 40 78 35" stroke="currentColor" fill="none" stroke-width="2.5"/>
        <path d="M 50 62 Q 50 70 55 75 Q 60 80 65 78" stroke="currentColor" fill="none" stroke-width="2.5"/>
        <path d="M 38 50 Q 30 50 25 55 Q 20 60 22 65" stroke="currentColor" fill="none" stroke-width="2.5"/>
        <!-- Decorative dots at arm ends -->
        <circle cx="35" cy="22" r="2"/>
        <circle cx="78" cy="35" r="2"/>
        <circle cx="65" cy="78" r="2"/>
        <circle cx="22" cy="65" r="2"/>
        <!-- Inner decorative elements -->
        <circle cx="50" cy="50" r="4"/>
      </g>
    </pattern>
  </defs>
  <rect width="100" height="100" fill="url(#gye-nyame-pattern)"/>
</svg>
